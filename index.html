<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Havelok's Kingdom</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <main class="screen">
      <p class="eyebrow">Havelok's Kingdom</p>
      <h1>Viking Treasure Trail</h1>
      <p class="lead">
        Five Viking treasures are hidden around the trail.
        Find the Viking images, point your camera at them,
        and collect all five treasures.
      </p>
      <p id="status">Starting the project…</p>
      <button id="start-camera" type="button">Start camera</button>
    </main>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="card-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <section id="panel" class="panel">
      <h2>Picture found</h2>
      <p>This panel stays on the screen. The camera only recognised the card.</p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
